services:
  rustfs:
    image: rustfs/rustfs:latest
    ports:
      - "9574:9000"
      # RustFS Console is available at http://localhost:9321
      - "9321:9001"
    env_file: rustfs.env
    environment:
      - RUSTFS_VOLUMES=/data
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_CONSOLE_ENABLE=true
      - RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS=*
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 20s
    volumes:
      - rustfs_data:/data
    networks:
      - dudes_network

  rustfs-create-bucket:
    image: rustfs/rc:latest
    depends_on:
      rustfs:
        condition: service_healthy
    env_file: rustfs.env
    entrypoint: /rustfs_init.sh
    volumes:
      - ./buckets_list.txt:/buckets_list
      - ./rustfs_init.sh:/rustfs_init.sh
    networks:
      - dudes_network

volumes:
  rustfs_data:
    driver: local
